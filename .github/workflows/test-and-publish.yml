name: Test and publish to Nuget on new Github release

permissions:
  contents: read

on:
    release:
        types: [published]
    workflow_dispatch: 

jobs:
    test:
        runs-on: windows-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false

        steps:
          - name: Checkout
            uses: actions/checkout@v6

          - name: Setup .NET
            uses: actions/setup-dotnet@v5
            with:
              dotnet-version: |
                8.0.x
                9.0.x
                10.0.x
              cache: true
              cache-dependency-path: "**/packages.lock.json"

          - name: Restore
            run: dotnet restore .\Lexepars.sln --locked-mode

          - name: Test
            run: dotnet test .\Lexepars.sln -c Release --no-restore

    pack-and-upload:
        needs: test
        runs-on: windows-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v6

          - name: Setup .NET 10
            uses: actions/setup-dotnet@v5
            with:
              dotnet-version: '10.0.x'
              cache: true
              cache-dependency-path: "**/packages.lock.json"

          - name: Restore
            run: dotnet restore .\Lexepars.sln --locked-mode

          - name: Pack
            run: dotnet pack .\Lexepars.sln -c Release --no-restore -o ./artifacts
              -p:IncludeSymbols=true
              -p:SymbolPackageFormat=snupkg

          - name: Upload artifact
            uses: actions/upload-artifact@v6
            with:
              name: nuget-package
              path: |
                ./artifacts/*.nupkg
                ./artifacts/*.snupkg
